name: nix

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cachix のキャッシュ名。自分のキャッシュ名に合わせて変更する。
  #   cachix create ymm4-wine
  #   リポジトリの secret に CACHIX_AUTH_TOKEN を登録
  NIX_CACHE: ymm4-wine

jobs:
  wine:
    name: nix build .#wine
    runs-on: ubuntu-latest
    # wine-wow64 (i386 側の mingw 含む) のフルビルド。初回は数時間かかりうる。
    timeout-minutes: 350
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.NIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - run: nix build .#wine -L
